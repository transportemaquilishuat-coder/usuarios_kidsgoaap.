<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso al portal</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Ingreso seguro</p>
            <h1>Selecciona tu perfil</h1>
            <p>Este portal está preparado para el rol de administrador de colegio y el rol de superadministrador, con
                acceso diferenciado según el perfil.</p>

            <form id="loginForm" class="auth-form">
                <label for="role">Tipo de acceso</label>
                <select id="role" name="role">
                    <option value="school">Administrador de colegio</option>
                    <option value="superadmin">Superadministrador</option>
                </select>

                <label for="email">Correo institucional</label>
                <input id="email" name="email" type="email" placeholder="colegio@ejemplo.com" />

                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="••••••••" />

                <button class="btn btn--primary" type="submit">Ingresar</button>
            </form>

            <a class="link" href="/">Volver al inicio</a>
        </section>
    </main>

    <script src="/api-config.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
