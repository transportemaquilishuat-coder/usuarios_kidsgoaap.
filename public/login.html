<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="login.title">Acceso al portal</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card">
            <div class="lang-switcher auth-switcher" aria-label="Selector de idioma">
                <button type="button" class="lang-chip" data-lang-switch="es">ES</button>
                <button type="button" class="lang-chip" data-lang-switch="en">EN</button>
            </div>
            <p class="eyebrow" data-i18n="login.eyebrow">Ingreso seguro</p>
            <h1 data-i18n="login.titleHeading">Selecciona tu perfil</h1>
            <p data-i18n="login.description">Este portal está preparado para el rol de administrador de colegio y el rol
                de superadministrador, con acceso diferenciado según el perfil.</p>

            <form id="loginForm" class="auth-form">
                <label for="role" data-i18n="login.roleLabel">Tipo de acceso</label>
                <select id="role" name="role">
                    <option value="school" data-i18n="login.schoolOption">Administrador de colegio</option>
                    <option value="superadmin" data-i18n="login.superadminOption">Superadministrador</option>
                </select>

                <label for="email" data-i18n="login.emailLabel">Correo institucional</label>
                <input id="email" name="email" type="email" placeholder="colegio@ejemplo.com" />

                <label for="password" data-i18n="login.passwordLabel">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="••••••••" />

                <button class="btn btn--primary" type="submit" data-i18n="login.submit">Ingresar</button>
            </form>

            <p class="helper-text" data-i18n="login.helper">Si el backend no está disponible, el sistema continuará en
                modo demo para permitir la navegación.</p>
            <a class="link" href="/" data-i18n="login.back">Volver al inicio</a>
        </section>
    </main>

    <script src="/api-config.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
